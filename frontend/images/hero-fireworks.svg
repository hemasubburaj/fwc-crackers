<svg viewBox="0 0 600 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A1710"/>
      <stop offset="55%" stop-color="#7A2A17"/>
      <stop offset="100%" stop-color="#D9A431"/>
    </linearGradient>
    <radialGradient id="burstGrad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE9B8"/>
      <stop offset="45%" stop-color="#F2B84B"/>
      <stop offset="100%" stop-color="#F2B84B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="burstGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD9CE"/>
      <stop offset="45%" stop-color="#E8654A"/>
      <stop offset="100%" stop-color="#E8654A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="520" fill="url(#skyGrad)"/>

  <!-- distant stars -->
  <g fill="#FFF6E0" opacity="0.7">
    <circle cx="60" cy="60" r="1.6"/>
    <circle cx="120" cy="140" r="1.2"/>
    <circle cx="500" cy="80" r="1.8"/>
    <circle cx="430" cy="180" r="1.2"/>
    <circle cx="90" cy="250" r="1.4"/>
    <circle cx="540" cy="260" r="1.6"/>
    <circle cx="250" cy="60" r="1.2"/>
    <circle cx="330" cy="120" r="1.4"/>
  </g>

  <!-- large burst top right -->
  <circle cx="430" cy="140" r="140" fill="url(#burstGrad1)"/>
  <g stroke="#FFE9B8" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
    <line x1="430" y1="140" x2="430" y2="40"/>
    <line x1="430" y1="140" x2="430" y2="240"/>
    <line x1="430" y1="140" x2="330" y2="140"/>
    <line x1="430" y1="140" x2="530" y2="140"/>
    <line x1="430" y1="140" x2="360" y2="70"/>
    <line x1="430" y1="140" x2="500" y2="210"/>
    <line x1="430" y1="140" x2="360" y2="210"/>
    <line x1="430" y1="140" x2="500" y2="70"/>
  </g>
  <g fill="#F2B84B">
    <circle cx="430" cy="40" r="4"/>
    <circle cx="430" cy="240" r="4"/>
    <circle cx="330" cy="140" r="4"/>
    <circle cx="530" cy="140" r="4"/>
    <circle cx="360" cy="70" r="3"/>
    <circle cx="500" cy="210" r="3"/>
    <circle cx="360" cy="210" r="3"/>
    <circle cx="500" cy="70" r="3"/>
  </g>

  <!-- medium burst left -->
  <circle cx="140" cy="230" r="95" fill="url(#burstGrad2)"/>
  <g stroke="#FFD9CE" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <line x1="140" y1="230" x2="140" y2="160"/>
    <line x1="140" y1="230" x2="140" y2="300"/>
    <line x1="140" y1="230" x2="70" y2="230"/>
    <line x1="140" y1="230" x2="210" y2="230"/>
    <line x1="140" y1="230" x2="90" y2="180"/>
    <line x1="140" y1="230" x2="190" y2="280"/>
  </g>
  <g fill="#E8654A">
    <circle cx="140" cy="160" r="3"/>
    <circle cx="140" cy="300" r="3"/>
    <circle cx="70" cy="230" r="3"/>
    <circle cx="210" cy="230" r="3"/>
  </g>

  <!-- small accent burst bottom right -->
  <circle cx="480" cy="380" r="60" fill="url(#burstGrad1)" opacity="0.8"/>
  <g stroke="#FFE9B8" stroke-width="1.6" stroke-linecap="round" opacity="0.8">
    <line x1="480" y1="380" x2="480" y2="335"/>
    <line x1="480" y1="380" x2="480" y2="425"/>
    <line x1="480" y1="380" x2="435" y2="380"/>
    <line x1="480" y1="380" x2="525" y2="380"/>
  </g>

  <!-- rising rocket trail -->
  <path d="M 250 520 Q 260 400 300 320" stroke="#FFE9B8" stroke-width="2" fill="none" stroke-dasharray="3 6" opacity="0.7"/>
  <circle cx="300" cy="320" r="3.5" fill="#FFE9B8"/>

  <!-- ground silhouette -->
  <path d="M0 480 Q150 460 300 480 T600 470 L600 520 L0 520 Z" fill="#1E0D07" opacity="0.55"/>
</svg>
