  </section>

  <script src="../js/config.js"></script>

  <script>

    // ==========================================
    // ADMIN LOGIN
    // ==========================================

    const TOKEN_KEY = "fcw_admin_token";

    const form =
      document.getElementById("login-form");

    const errorEl =
      document.getElementById("login-error");

    const loginButton =
      document.getElementById("login-button");


    form.addEventListener("submit", async (e) => {

      e.preventDefault();

      errorEl.style.display = "none";
      errorEl.textContent = "";

      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";


      try {

        const formData =
          new FormData(form);

        const email =
          formData.get("email");

        const password =
          formData.get("password");


        // ==========================================
        // LOGIN API
        // ==========================================

        const res =
          await fetch(
            `${API_BASE_URL}/auth/login`,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                email,
                password
              })
            }
          );


        const data =
          await res.json().catch(() => ({}));


        if (!res.ok) {

          throw new Error(
            data.message ||
            `Login failed (${res.status})`
          );

        }


        if (!data.token) {

          throw new Error(
            "Login successful, but no token was received."
          );

        }


        // ==========================================
        // SAVE TOKEN
        // ==========================================

        localStorage.setItem(
          TOKEN_KEY,
          data.token
        );


        // ==========================================
        // GO TO ADMIN DASHBOARD
        // ==========================================

        window.location.href =
          "index.html";

      }

      catch (error) {

        console.error(
          "Login error:",
          error
        );

        errorEl.textContent =
          error.message ||
          "Unable to login.";

        errorEl.style.display =
          "block";

        loginButton.disabled = false;

        loginButton.textContent =
          "Log In";

      }

    });


    // ==========================================
    // CHECK EXISTING TOKEN
    // ==========================================

    (async () => {

      const token =
        localStorage.getItem(TOKEN_KEY);

      if (!token) return;


      try {

        const res =
          await fetch(
            `${API_BASE_URL}/auth/verify`,
            {
              method: "GET",

              headers: {
                Authorization:
                  `Bearer ${token}`
              }
            }
          );


        if (res.ok) {

          window.location.href =
            "index.html";

        }

      }

      catch (error) {

        console.log(
          "Token verification failed"
        );

        localStorage.removeItem(
          TOKEN_KEY
        );

      }

    })();

  </script>
